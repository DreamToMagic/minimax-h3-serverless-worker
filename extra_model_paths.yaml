# Serverless 网络卷挂载在 /runpod-volume。
# 卷内目录结构（与 ComfyUI models 目录一致）：
#   /runpod-volume/models/diffusion_models/
#   /runpod-volume/models/text_encoders/
#   /runpod-volume/models/vae/
#   /runpod-volume/models/loras/
minimax_h3_volume:
  base_path: /runpod-volume/models
  checkpoints: diffusion_models
  diffusion_models: diffusion_models
  unet: diffusion_models
  clip: text_encoders
  text_encoders: text_encoders
  vae: vae
  loras: loras
